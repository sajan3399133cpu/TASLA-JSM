<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TASLA JSM</title>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui;overflow:hidden}#c{width:100%;height:62vh;display:block}.hud{display:flex;gap:4px;padding:5px;background:#0a0a0a}.card{flex:1;background:#111;border:1px solid #222;border-radius:6px;padding:5px;text-align:center;font-size:10px}.card b{color:#00ff88;font-size:13px;display:block}.log{height:16vh;overflow:auto;background:#000;color:#0f0;font:9px monospace;padding:5px}</style></head>
<body><canvas id="c"></canvas><div class="hud"><div class="card"><b id="d">--</b><span id="o">LiDAR Scanning</span></div><div class="card"><b id="s">0</b>SPEED<br><span style="color:#00ff88">AUTO</span></div><div class="card"><b id="st">0°</b><span id="b">Human Brain</span></div></div><div class="log" id="log"></div>
<script>
let cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,off=0,speed=50,egoLane=1,egoX=0,auto=true,steer=0,cars=[];
function rs(){W=cv.width=innerWidth*2;H=cv.height=innerHeight*0.62*2}rs();
function lg(t){let el=document.getElementById('log');el.innerHTML='['+new Date().toLocaleTimeString().split(' ')[0]+'] '+t+'<br>'+el.innerHTML}
function spawn(){cars=[];for(let i=0;i<6;i++)cars.push({z:400+i*220,lane:Math.floor(Math.random()*3),type:Math.random()>0.7?'rickshaw':Math.random()>0.5?'car':'bike'})}spawn();

function draw(){
off+=speed;
let horizon=H*0.38;
ctx.fillStyle='#0a0a18';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.moveTo(W*0.5-6,horizon);ctx.lineTo(W*0.15,H);ctx.lineTo(W*0.85,H);ctx.lineTo(W*0.5+6,horizon);ctx.closePath();ctx.fill();
ctx.strokeStyle='#555';ctx.setLineDash([30,25]);ctx.lineDashOffset=-off%55;ctx.lineWidth=2;
for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(W*0.5+i*8,horizon);ctx.lineTo(W*0.5+i*W*0.22,H);ctx.stroke()}ctx.setLineDash([]);

// find closest
let closest=null,minZ=1e9;
cars.forEach(c=>{c.z-=speed*0.6;if(c.z<30){c.z=900+Math.random()*300;c.lane=Math.floor(Math.random()*3);c.type=Math.random()>0.7?'rickshaw':Math.random()>0.5?'car':'bike'} if(c.lane===egoLane && c.z>40 && c.z<minZ){minZ=c.z;closest=c}});

if(closest){
let dist=Math.floor(minZ/6);
document.getElementById('d').innerText=dist+'m';document.getElementById('o').innerText=closest.type.toUpperCase()+' AHEAD';
if(minZ<110){speed=Math.max(0,speed-6);document.getElementById('b').innerText='BRAKING';if(minZ%22<2)lg('BRAIN: Brake - '+closest.type+' '+dist+'m LiDAR < 20m')}
else if(minZ<260){let freeLanes=[0,1,2].filter(l=>l!==egoLane &&!cars.some(o=>o.lane===l && Math.abs(o.z-minZ)<180));if(freeLanes.length>0){let target=freeLanes[0];let dir=target-egoLane;egoX+=dir*0.02;steer=dir*18;if(Math.abs(egoX)>0.9){egoLane=target;egoX=0}document.getElementById('b').innerText='OVERTAKE '+closest.type;if(minZ%35<2)lg('BRAIN: Overtake '+closest.type+' | Lane '+target);}else{speed=Math.max(10,speed-2)}}
}else{document.getElementById('d').innerText='CLEAR';document.getElementById('o').innerText='NO OBSTACLE';document.getElementById('b').innerText='Cruising - Pickup: Karachi→Clifton';speed=Math.min(70,speed+0.3);egoX*=0.96;steer*=0.92}

// draw other cars - SMALL & ON ROAD
cars.sort((a,b)=>b.z-a.z).forEach(c=>{
let p=400/(c.z+300);let y=horizon+(H-horizon)*(1-p*0.9);let x=W*0.5 + (c.lane-1)*W*0.22*p + (c.lane===egoLane?egoX*W*0.15*p:0);let w=p*90,h=p*38;if(w<4||y<horizon)return;
ctx.fillStyle=c.type==='rickshaw'?'#ffcc00':c.type==='bike'?'#ff4444':'#ff5555';ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle='#111';ctx.fillRect(x-w/2+w*0.1,y-h+h*0.15,w*0.8,h*0.2);
});

// ego corolla - SMALL, ONLY 1 LANE
let ex=W*0.5+egoX*W*0.22*0.6;let ew=W*0.14,eh=W*0.06; // choti kar di
ctx.fillStyle='#00ff88';ctx.fillRect(ex-ew/2,H-eh-8,ew,eh);ctx.fillStyle='#002211';ctx.fillRect(ex-ew/2+6,H-eh-2,ew-12,eh*0.3);
document.getElementById('s').innerText=Math.floor(speed)+' km/h';document.getElementById('st').innerText=Math.floor(steer)+'°';
requestAnimationFrame(draw)
}
draw();lg('TASLA JSM - True FSD Started');lg('Mission: Auto pickup/drop - Karachi 3AM Build - $300K prevented');
</script></body></html>
