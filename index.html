<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TASLA JSM v5 - LIVE Mission Control</title>
<style>
body{margin:0;background:#050510;color:#fff;font-family:system-ui;overflow:hidden}
.top{padding:10px 15px;display:flex;justify-content:space-between;align-items:center;background:#0f0f1f;border-bottom:1px solid #222}
canvas{width:100%;height:52vh;background:linear-gradient(#0a0a1a,#000);display:block}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px}
.btn{padding:14px;border-radius:10px;border:none;font-weight:800;color:#000}
.b1{background:#00ff88}.b2{background:#ffaa00}.b3{background:#ff3b3b}
.b4{background:#00d4ff}.b5{background:#fff}.b6{background:#444;color:#fff}
.stats{display:flex;gap:8px;padding:8px 12px;font-size:12px}
.s{flex:1;background:#111;border:1px solid #222;padding:10px;border-radius:8px;text-align:center}
.s b{display:block;font-size:16px;color:#00ff88}
</style></head>
<body>
<div class="top"><b>TASLA JSM v5 • LIVE</b><span style="color:#00ff88;font-size:12px">● ProDriverBrain ACTIVE</span></div>
<canvas id="road"></canvas>
<div class="stats">
<div class="s"><b id="speed">0</b>km/h SPEED</div>
<div class="s"><b id="saved">$300K</b>SAVED</div>
<div class="s"><b id="inc">6</b>Incidents</div>
<div class="s"><b id="roi">300%</b>ROI</div>
</div>
<div class="controls">
<button class="btn b1" onclick="cmd('OVERTAKE')">OVERTAKE</button>
<button class="btn b2" onclick="cmd('LANE LEFT')">LANE LEFT</button>
<button class="btn b2" onclick="cmd('LANE RIGHT')">LANE RIGHT</button>
<button class="btn b3" onclick="cmd('EMERGENCY BRAKE')">BRAKE</button>
<button class="btn b4" onclick="startVoice()">🎤 VOICE</button>
<button class="btn b5" onclick="window.open('https://github.com/sajan3399133cpu/TASLA-JSM')">GitHub</button>
</div>
<div id="log" style="height:20vh;overflow:auto;background:#080808;padding:10px;font-family:monospace;font-size:11px;color:#0f0"></div>
<script>
let c=document.getElementById('road'),x=c.getContext('2d'),lane=1,speed=45,offset=0;
function resize(){c.width=innerWidth*2;c.height=innerHeight*0.52*2}
resize();window.onresize=resize;
function draw(){
offset+=speed*0.1;
x.clearRect(0,0,c.width,c.height);
// road
x.fillStyle='#151515';x.fillRect(c.width*0.15,0,c.width*0.7,c.height);
x.strokeStyle='#333';x.setLineDash([40,40]);x.lineWidth=4;
for(let i=-1;i<=1;i++){x.beginPath();x.moveTo(c.width*0.5+i*c.width*0.18,0);x.lineTo(c.width*0.5+i*c.width*0.18,c.height);x.stroke()}
x.setLineDash([]);
// dashed center movement
x.strokeStyle='#555';x.lineWidth=6;x.setLineDash([30,30]);x.lineDashOffset=-offset%60;
for(let k=0;k<2;k++){x.beginPath();x.moveTo(c.width*(0.33+k*0.34),0);x.lineTo(c.width*(0.33+k*0.34),c.height);x.stroke()}
x.setLineDash([]);
// cars ahead
for(let i=0;i<3;i++){let y=(offset+i*400)%800-100;let lx=0.25+Math.floor(Math.random()*3)*0.2;
x.fillStyle='#ffaa00';x.fillRect(c.width*lx+20,y,80,40)}
// ego car (Corolla)
x.fillStyle='#00ff88';x.fillRect(c.width*(0.18+lane*0.18)+15,c.height-120,90,55);
x.fillStyle='#000';x.fillRect(c.width*(0.18+lane*0.18)+25,c.height-125,70,12);
x.fillStyle='#fff';x.font='bold 22px sans-serif';x.fillText('COROLLA',c.width*(0.18+lane*0.18)+10,c.height-130);
requestAnimationFrame(draw)
}
draw();
function log(t){let d=document.getElementById('log');d.innerHTML='['+new Date().toLocaleTimeString()+'] '+t+'<br>'+d.innerHTML}
function cmd(t){
log('>> COMMAND: '+t+' | ProDriverBrain deciding...');
if(t.includes('LEFT')&&lane>0)lane--;
if(t.includes('RIGHT')&&lane<2)lane++;
if(t=='OVERTAKE'){lane=(lane+1)%3;speed=78;log('Overtaking! Speed 78 | Future pred 10s clear');setTimeout(()=>speed=45,3000)}
if(t.includes('BRAKE')){speed=0;log('EMERGENCY BRAKE! Incident prevented - $50k saved');setTimeout(()=>speed=45,2000)}
else log('Action executed - LIDAR Fusion OK');
document.getElementById('speed').innerText=speed;
}
function startVoice(){
let r=new (window.SpeechRecognition||window.webkitSpeechRecognition)();r.lang='en-US';r.start();log('🎤 Listening... bolo "Overtake"');
r.onresult=e=>{let txt=e.results[0][0].transcript.toUpperCase();log('VOICE: '+txt);if(txt.includes('OVER'))cmd('OVERTAKE');else if(txt.includes('LEFT'))cmd('LANE LEFT');else if(txt.includes('RIGHT'))cmd('LANE RIGHT');else if(txt.includes('BRAKE'))cmd('EMERGENCY BRAKE');}
}
log('TASLA JSM v5 Initialized - Karachi 3AM Build - JSM AI Ready');log('CARLA Ready - Fallback SIM Mode - ProDriverBrain 64-neuron');
setInterval(()=>{if(speed>0)speed=40+Math.random()*15;document.getElementById('speed').innerText=Math.floor(speed)},800);
</script>
</body></html>
