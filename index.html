<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TASLA JSM</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;overflow:hidden}
#c{width:100%;height:60vh;display:block}
.hud{display:flex;gap:5px;padding:6px;background:#080808}
.card{flex:1;background:#111;border:1px solid #222;border-radius:8px;padding:6px;text-align:center;font-size:11px}
.card b{color:#00ff88;font-size:14px;display:block}
.log{height:18vh;overflow:auto;background:#000;color:#0f0;font:10px monospace;padding:6px;border-top:1px solid #222}
button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:900}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="hud">
<div class="card"><b id="dist">--</b>LiDAR<br><span id="obj">Scanning</span></div>
<div class="card"><b id="spd">0</b>SPEED<br><span style="color:#00ff88">AUTO PILOT ON</span></div>
<div class="card"><b id="st">0°</b>Steering<br><span id="br">Brain: Active</span></div>
</div>
<div class="hud">
<button style="background:#00ff88" onclick="auto=!auto;this.innerText=auto?'AUTO ON':'AUTO OFF'">AUTO ON</button>
<button style="background:#222;color:#fff" onclick="cars.push({z:600,x:(Math.random()-0.5)*1.2,type:'rickshaw'})">+ Rickshaw</button>
</div>
<div class="log" id="log"></div>
<script>
let cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,off=0,speed=55,auto=true,steer=0,cars=[],egoX=0;
function rs(){W=cv.width=innerWidth*2;H=cv.height=innerHeight*0.6*2}rs();
function lg(t){let l=document.getElementById('log');l.innerHTML='['+new Date().toLocaleTimeString()+'] '+t+'<br>'+l.innerHTML}
for(let i=0;i<5;i++)cars.push({z:300+i*250,x:(Math.random()-0.5)*1.2,type:Math.random()>0.6?'car':'bike'});

function draw(){
off+=speed*0.5;
ctx.fillStyle='#0d0d1a';ctx.fillRect(0,0,W,H);
// road - fixed perspective
let horizon=H*0.42;
ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(W*0.5-8,horizon);ctx.lineTo(0,H);ctx.lineTo(W,H);ctx.lineTo(W*0.5+8,horizon);ctx.closePath();ctx.fill();
// lane lines
ctx.strokeStyle='#666';ctx.setLineDash([35,35]);ctx.lineDashOffset=-off%70;ctx.lineWidth=3;
for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(W*0.5+i*10,horizon);ctx.lineTo(W*0.5+i*W*0.28,H);ctx.stroke()}
ctx.setLineDash([]);

let closest=null,minZ=9999;
cars.forEach(c=>{
c.z-=speed*0.7;
if(c.z<20){c.z=900+Math.random()*300;c.x=(Math.random()-0.5)*1.2;}
if(Math.abs(c.x-egoX)<0.45 && c.z<minZ && c.z>30){minZ=c.z;closest=c;}
});

// AUTO BRAIN
if(auto && closest){
let d=Math.floor(minZ/8);
document.getElementById('dist').innerText=d+'m';
document.getElementById('obj').innerText=closest.type.toUpperCase()+' AHEAD';
if(minZ<90){speed=Math.max(0,speed-5);document.getElementById('br').innerText='BRAKING';if(minZ%20<2)lg('AUTO BRAKE '+d+'m - '+closest.type);}
else if(minZ<220){let target=closest.x>0?-0.6:0.6;egoX+=(target-egoX)*0.04;steer= (target-egoX)*35;document.getElementById('br').innerText='OVERTAKE '+closest.type; if(minZ%30<2)lg('AUTO OVERTAKE '+closest.type+' '+d+'m');speed=65;}
else{speed=Math.min(75,speed+0.4)}
}else{
if(auto){speed=Math.min(75,speed+0.4);egoX*=0.97;steer*=0.9;document.getElementById('dist').innerText='CLEAR';document.getElementById('obj').innerText='ROAD CLEAR';document.getElementById('br').innerText='CRUISING';}
}

// draw cars on road - STAY ON ROAD
cars.sort((a,b)=>a.z-b.z).forEach(c=>{
let p= 500/(c.z+200);
let y= horizon + (H-horizon)*(1-p);
let x= W*0.5 + (c.x-egoX)*W*0.35*p;
let w= p*180, h= p*80;
if(w<3||y<horizon)return;
ctx.fillStyle=c.type=='rickshaw'?'#ffb700':c.type=='bike'?'#ff3b3b':'#e33';
ctx.fillRect(x-w/2,y-h,w,h);
ctx.fillStyle='#111';ctx.fillRect(x-w/2+w*0.1,y-h+h*0.1,w*0.8,h*0.25);
});

// EGO CAR - hamari Corolla neeche
let egoW=W*0.5, egoH=W*0.15;
ctx.fillStyle='#00ff88';ctx.fillRect(W*0.5-egoW/2,H-egoH,W*0.5,egoH*0.6);
ctx.fillStyle='#003322';ctx.fillRect(W*0.5-egoW/2+10,H-egoH+8,W*0.45,egoH*0.2);
ctx.fillStyle='#fff';ctx.font='bold '+(W*0.04)+'px sans-serif';ctx.fillText('TASLA JSM - COROLLA',W*0.5-egoW/2+10,H-egoH+45);

document.getElementById('spd').innerText=Math.floor(speed)+' km/h';
document.getElementById('st').innerText=Math.floor(steer)+'°';
requestAnimationFrame(draw)
}
draw();lg('TASLA JSM Started - Road pe caren, hawa me nahi');lg('Auto pickup/drop ready - Sawari bolo kahan jana hai');
</script></body></html>
