<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TASLA JSM v7 - Real 3D FSD</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;overflow:hidden}
#c{width:100%;height:58vh;display:block}
.hud{display:flex;gap:5px;padding:6px;background:#0a0a0a}
.card{flex:1;background:#111;border:1px solid #222;border-radius:8px;padding:6px;text-align:center;font-size:11px}
.card b{color:#00ff88;font-size:14px;display:block}
#wheel{width:70px;height:70px;border:5px solid #333;border-radius:50%;margin:auto;position:relative;transition:0.15s}
#wheel::after{content:'';position:absolute;top:3px;left:50%;width:5px;height:28px;background:#00ff88;transform:translateX(-50%)}
.log{height:18vh;overflow:auto;background:#000;color:#0f0;font:10px monospace;padding:6px;border-top:1px solid #222}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="hud">
<div class="card"><div id="wheel"></div><span id="st">0°</span></div>
<div class="card"><b id="dist">--</b>LiDAR Distance<br><span id="brain">AUTO Brain: Active</span><br><b id="obj" style="color:#ffaa00">Scanning</b></div>
<div class="card"><b id="spd">0 km/h</b><b id="nav" style="color:#00d4ff;font-size:11px">Pickup: Karachi → Drop: Clifton</b><br><span style="color:#00ff88">● AUTO PILOT ON</span></div>
</div>
<div class="hud"><button onclick="auto=!auto;this.innerText=auto?'AUTO: ON':'AUTO: OFF';this.style.background=auto?'#00ff88':'#ff4444'" style="flex:1;padding:12px;border:none;border-radius:8px;font-weight:900;background:#00ff88">AUTO: ON</button><button onclick="cars.push({z:600,x:(Math.random()-0.5)*0.6,type:'rickshaw'})" style="flex:1;padding:12px;border:none;border-radius:8px;background:#222;color:#fff">+ Rickshaw Test</button></div>
<div class="log" id="log"></div>
<script>
let cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,offset=0,speed=55,lane=0,auto=true,cars=[],steer=0;
function rs(){W=cv.width=innerWidth*2;H=cv.height=innerHeight*0.58*2}rs();
function lg(t){let l=document.getElementById('log');l.innerHTML='['+new Date().toLocaleTimeString()+'] '+t+'<br>'+l.innerHTML}
for(let i=0;i<5;i++)cars.push({z:200+i*300,x:(Math.random()-0.5)*0.8,type:Math.random()>0.6?'car':'bike'});
function drawRoad(){
let horizon=H*0.35;
let grad=ctx.createLinearGradient(0,horizon,H,0);grad.addColorStop(0,'#0a0a2a');grad.addColorStop(1,'#000');
ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
// road perspective
ctx.fillStyle='#1e1e1e';
ctx.beginPath();ctx.moveTo(W*0.5-10,horizon);ctx.lineTo(W*0.5- W*0.4,H);ctx.lineTo(W*0.5+W*0.4,H);ctx.lineTo(W*0.5+10,horizon);ctx.closePath();ctx.fill();
// lane markers perspective
ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.setLineDash([40,40]);ctx.lineDashOffset=-offset%80;
for(let l=-1;l<=1;l++){ctx.beginPath();let x1=W*0.5 + l*12, x2=W*0.5 + l*W*0.15;ctx.moveTo(x1,horizon);ctx.lineTo(x2,H);ctx.stroke()}
ctx.setLineDash([]);
}
function drawCar3D(c){
let perspective = 600 / (c.z+100);
let y = H*0.35 + (H*0.65)*(1 - 600/(c.z+600));
let x = W*0.5 + c.x * W*0.4 * perspective + lane*W*0.1*perspective;
let s = perspective*120;
if(s<5||y>H||y< H*0.35)return false;
ctx.save();ctx.translate(x,y);
let col=c.type=='rickshaw'?'#ffbb00':c.type=='bike'?'#ff4444':'#ff3333';
ctx.fillStyle=col;ctx.fillRect(-s/2,-s/2,s,s*0.6);
ctx.fillStyle='#000';ctx.fillRect(-s/2+s*0.1,-s*0.3,s*0.8,s*0.2); // windshield
ctx.fillStyle='#fff';ctx.fillRect(-s/2+s*0.7,-s*0.1,s*0.15,s*0.1); // light
ctx.restore();
return {x,y,s,realZ:c.z}
}
function loop(){
offset+=speed*0.6;
if(auto){
let closest=null,minZ=999;
cars.forEach(c=>{if(Math.abs(c.x+lane*0.2)<0.3 && c.z<minZ && c.z>30){minZ=c.z;closest=c}});
document.getElementById('dist').innerText=closest?Math.floor(minZ/10)+'m':'CLEAR';
document.getElementById('obj').innerText=closest?closest.type.toUpperCase()+' DETECTED':'NO OBSTACLE';
if(closest){
if(minZ<80){speed=Math.max(0,speed-4);steer=0;lg('🧠 AUTO BRAKE! '+closest.type+' '+Math.floor(minZ/10)+'m ahead | LiDAR STOP');document.getElementById('brain').innerText='BRAKING!';
}else if(minZ<200){
let targetX = closest.x>0? -0.4:0.4; lane+= (targetX-lane)*0.05; steer=targetX*30; lg('🧠 OVERTAKE '+closest.type+' | Steering '+Math.floor(steer)+'°');document.getElementById('brain').innerText='OVERTAKING '+closest.type;
}else{speed=Math.min(80,speed+0.3);document.getElementById('brain').innerText='Cruising - Auto pickup/drop ready';}
}else{speed=Math.min(80,speed+0.5);steer*=0.92}
}
cars.forEach(c=>{c.z-=speed*0.8;if(c.z<10){c.z=800+Math.random()*400;c.x=(Math.random()-0.5)*0.9;c.type=Math.random()>0.7?'rickshaw':Math.random()>0.5?'car':'bike'}});
ctx.clearRect(0,0,W,H);drawRoad();
cars.sort((a,b)=>b.z-a.z).forEach(c=>drawCar3D(c));
// ego dashboard hood
ctx.fillStyle='#0a0a0a';ctx.fillRect(0,H*0.85,W,H*0.15);
ctx.fillStyle='#222';ctx.fillRect(W*0.1,H*0.88,W*0.8,20);
document.getElementById('spd').innerText=Math.floor(speed)+' km/h';
document.getElementById('wheel').style.transform='rotate('+steer+'deg)';
document.getElementById('st').innerText=Math.floor(steer)+'°';
requestAnimationFrame(loop)
}
loop();lg('TASLA JSM v7 Real 3D FSD Started - Human Brain Level');lg('Auto pickup/drop logic: Tell destination, auto will go');
</script></body></html>
