<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TASLA JSM - TRUE AUTONOMOUS</title>
<style>
body{margin:0;background:#050510;color:#fff;font-family:system-ui;overflow:hidden}
.top{padding:10px;display:flex;justify-content:space-between;background:#111;border-bottom:1px solid #222}
canvas{width:100%;height:55vh;display:block;background:#0a0a12}
.row{display:flex;gap:6px;padding:8px}
.card{flex:1;background:#111;border:1px solid #222;border-radius:8px;padding:8px;text-align:center;font-size:12px}
.card b{display:block;color:#00ff88;font-size:15px}
#wheel{width:60px;height:60px;border:4px solid #444;border-radius:50%;margin:auto;position:relative;transition:0.3s}
#wheel::after{content:'';position:absolute;top:2px;left:50%;width:4px;height:26px;background:#00ff88;transform:translateX(-50%)}
.log{height:18vh;overflow:auto;background:#000;padding:8px;font:11px monospace;color:#0f0;border-top:1px solid #222}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-weight:800}
.on{background:#00ff88}.off{background:#ff3b3b}
</style></head>
<body>
<div class="top"><b>TASLA JSM • AUTO PILOT</b><span style="color:#00ff88">● HUMAN BRAIN ACTIVE</span></div>
<canvas id="c"></canvas>
<div class="row">
<div class="card"><div id="wheel"></div><span id="steerTxt">Steering: 0°</span></div>
<div class="card"><b id="dist">--</b>Front Car Distance<br><span id="brain">Brain: Scanning...</span></div>
<div class="card"><b id="sp">0</b>SPEED<br><b id="mode" style="color:#00ff88">AUTO ON</b></div>
</div>
<div class="row">
<button class="btn on" id="autoBtn" onclick="toggleAuto()">AUTO: ON</button>
<button class="btn" style="background:#222;color:#fff" onclick="addRickshaw()">+ Add Rickshaw/Bike Test</button>
</div>
<div class="log" id="log"></div>
<script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W,H,lane=1,speed=50,offset=0,auto=true,frontCars=[],steerAng=0;
function resize(){W=canvas.width=innerWidth*2;H=canvas.height=innerHeight*0.55*2}resize();
function log(t){let l=document.getElementById('log');l.innerHTML='['+new Date().toLocaleTimeString()+'] '+t+'<br>'+l.innerHTML}
function spawnCars(){frontCars=[];for(let i=0;i<4;i++)frontCars.push({lane:Math.floor(Math.random()*3),y:-i*500-Math.random()*600, speed:20+Math.random()*20, type:Math.random()>0.7?'rickshaw':'car'})}
spawnCars();
let keys={};
function drawCar(x,y,color,isEgo){
ctx.save();ctx.translate(x,y);
ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(0,0,isEgo?110:90,isEgo?60:45,12);ctx.fill();
ctx.fillStyle='#111';ctx.fillRect(8,10,isEgo?94:74,8);
ctx.fillStyle='#aaffff';ctx.fillRect(isEgo?85:70,15,18,10); // headlight
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(15, isEgo?60:45,10,0,Math.PI*2);ctx.arc(75,isEgo?60:45,10,0,Math.PI*2);ctx.fill();
ctx.restore();
}
function draw(){
offset+=speed;
ctx.clearRect(0,0,W,H);
ctx.fillStyle='#1a1a1a';ctx.fillRect(W*0.12,0,W*0.76,H);
ctx.strokeStyle='#444';ctx.lineWidth=3;ctx.setLineDash([30,30]);ctx.lineDashOffset=-offset%60;
for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(W*(0.12+i*0.76/3),0);ctx.lineTo(W*(0.12+i*0.76/3),H);ctx.stroke()}
ctx.setLineDash([]);
// update and draw front cars
let closest=Infinity, closestCar=null;
frontCars.forEach(f=>{
f.y+= (speed - f.speed);
if(f.y>H+100){f.y=-400-Math.random()*400;f.lane=Math.floor(Math.random()*3)}
let cx=W*(0.14+f.lane*0.76/3)+10, cy=f.y;
if(f.lane==lane){let d=H-150 - f.y; if(d>0 && d<closest){closest=d; closestCar=f}}
let col=f.type=='rickshaw'?'#ffaa00':'#ff4444';
drawCar(cx,cy,col,false);
if(f.type=='rickshaw'){ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.fillText('RIKSHAW',cx+5,cy-8)}
});
document.getElementById('dist').innerText=closest==Infinity?'CLEAR':Math.floor(closest/4)+'m';
if(auto){
if(closest<120){ // emergency
log('🧠 HUMAN BRAIN: Front car '+Math.floor(closest/4)+'m! BRAKE! | LiDAR < 20m');
speed=Math.max(0,speed-8); steerAng=0;
}else if(closest<280){
log('🧠 BRAIN: Car ahead '+Math.floor(closest/4)+'m - OVERTAKE DECISION | Changing lane');
let target=(lane+1)%3; // try right
let safe=true;
frontCars.forEach(f=>{if(f.lane==target && Math.abs(f.y-(H-150))<250)safe=false});
if(safe){lane=target; steerAng=target>lane?25:-25; speed=65; log('AUTO STEERING: Lane '+target+' | Distance safe');}
else{log('AUTO: Lane '+target+' blocked, waiting...')}
}else{
speed=Math.min(70,speed+0.5); steerAng*=0.9;
document.getElementById('brain').innerText='Brain: Road clear - Cruise';
}
}
if(Math.abs(steerAng)<2)steerAng=0;
document.getElementById('wheel').style.transform='rotate('+steerAng+'deg)';
document.getElementById('steerTxt').innerText='Steering: '+Math.floor(steerAng)+'°';
document.getElementById('sp').innerText=Math.floor(speed);
// ego
drawCar(W*(0.14+lane*0.76/3)+5,H-150,'#00ff88',true);
requestAnimationFrame(draw)
}
draw();
function toggleAuto(){auto=!auto;document.getElementById('autoBtn').innerText='AUTO: '+(auto?'ON':'OFF');document.getElementById('autoBtn').className='btn '+(auto?'on':'off');document.getElementById('mode').innerText=auto?'AUTO ON':'MANUAL';log(auto?'AUTO PILOT ENGAGED - Sawari uthane ko ready':'MANUAL MODE')}
function addRickshaw(){frontCars.push({lane:Math.floor(Math.random()*3),y:-200,speed:12,type:'rickshaw'});log('TEST: Rickshaw/Bike added - Brain detecting...')}
log('TASLA JSM v6 AUTO Started - Human Brain Logic ACTIVE');
log('Mission: Yahan se sawari uthao, wahan chor aao - FULL AUTO');
setInterval(()=>{if(frontCars.length<4 && Math.random()>0.7)addRickshaw()},5000);
</script></body></html>
