<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TASLA JSM v14 PRO LIVE</title>
<style>
:root{--tesla:#e82127}
*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:8px 12px;background:#101014;border-bottom:2px solid var(--tesla);font-size:11px}
.top b{color:var(--tesla)}.badge{background:#00ff88;color:#000;padding:2px 8px;border-radius:20px;font-weight:800;font-size:9px}
.time{color:#00ccff;font-weight:700}

/* ROAD WITH ENVIRONMENT */
.road{position:relative;width:100%;height:48vh;background:linear-gradient(#87CEEB 0%, #90EE90 30%, #333 100%);overflow:hidden} /* Sky + Fields */
.road::before{content:'';position:absolute;left:50%;bottom:0;width:100%;height:100%;background:#2a2a2a;transform:translateX(-50%);clip-path: polygon(15% 0, 85% 0, 100% 100%, 0% 100%);} /* Wider Road */
.buildings{position:absolute;top:0;width:100%;height:30%;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100"><rect x="10" y="40" width="20" height="60" fill="%23444"/><rect x="40" y="20" width="25" height="80" fill="%23555"/><rect x="75" y="50" width="15" height="50" fill="%23444"/></svg>') repeat-x;animation:city 20s linear infinite}
@keyframes city{from{background-position-x:0}to{background-position-x:-400px}} /* Moving City */
.lane-line{position:absolute;bottom:0;width:3px;height:100%;background:repeating-linear-gradient(to top,#fff 0 30px,transparent 30px 60px);animation:move 0.25s linear infinite} /* Faster */
@keyframes move{from{transform:translateY(0)}to{transform:translateY(60px)}}
.lane-line.l1{left:33.3%}.lane-line.l2{left:66.6%}

#ego{position:absolute;bottom:20px;left:50%;width:70px;height:32px;background:var(--tesla);border-radius:6px;transform:translateX(-50%);transition:left 0.15s ease;box-shadow:0 0 30px rgba(232,33,39,1)}
#ego::after{content:'TASLA JSM';position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:#0f0}
.traffic{position:absolute;bottom:0;left:0;width:100%;height:100%}
.car{position:absolute;border-radius:4px;transform:translateX(-50%)}
.car-label{position:absolute;font-size:8px;background:#000c;padding:2px 4px;border-radius:3px;color:#0f0;font-weight:700}

.cameras{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;background:#050505;height:16vh}
.cam{position:relative;background:#0a0a0a;border:1px solid #222;border-radius:4px;overflow:hidden}
.cam b{position:absolute;top:1px;left:3px;font-size:8px;background:#000a;padding:1px 3px;color:#0f0}
.box{position:absolute;border:2px solid #0f0;background:rgba(0,255,0,0.15)}

/* STEERING WHEEL */
.steer-wheel{position:absolute;bottom:5px;right:10px;width:50px;height:50px;border:4px solid #ccc;border-radius:50%;transition:transform 0.1s ease}
.steer-wheel::before{content:'';position:absolute;top:50%;left:50%;width:8px;height:8px;background:#ccc;border-radius:50%;transform:translate(-50%,-50%)}

.hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:4px;background:#0c0c0f}
.card{background:#15151a;border:1px solid #333;border-radius:6px;padding:5px;text-align:center}
.card b{font-size:11px;display:block}.g{color:#00ff88}.r{color:var(--tesla)}.y{color:#ffcc00}.c{color:#00ccff}
.log{height:10vh;overflow:auto;background:#000;font:8px monospace;color:#0f0;padding:4px}
</style></head>
<body>
<div class="top"><b>TASLA JSM v14 PRO LIVE</b><div><span class="time" id="clock">--:--:--</span> <span class="badge">LEVEL 5</span></div></div>

<div class="road" id="road">
<div class="buildings"></div>
<div class="lane-line l1"></div><div class="lane-line l2"></div>
<div id="ego"></div>
<div class="traffic" id="traffic"></div>
<div class="steer-wheel" id="wheel"></div>
</div>

<div class="cameras">
  <div class="cam"><b>FRONT AI</b><div id="camF"></div></div>
  <div class="cam"><b>LEFT</b><div id="camL"></div></div>
  <div class="cam"><b>RIGHT</b><div id="camR"></div></div>
  <div class="cam"><b>REAR</b><div id="camB"></div></div>
</div>

<div class="hud">
<div class="card"><b class="g" id="objects">0 OBJECTS</b><span id="obj">SCANNING</span></div>
<div class="card"><b id="speed">0 km/h</b><span class="c">FSD LIVE</span></div>
<div class="card"><b class="y" id="brain">BOOTING</b><span id="prediction">+10s</span></div>
<div class="card"><b class="g" id="distance">0.0 km</b><span>LIVE DATA</span></div>
</div>
<div class="log" id="log"></div>

<script>
const traffic=document.getElementById('traffic'),ego=document.getElementById('ego'),wheel=document.getElementById('wheel');
let egoLane=1,egoX=50,speed=65,steer=0,cars=[],distance=0,thinking="FSD CRUISE";
function log(t){document.getElementById('log').innerHTML=`[${new Date().toLocaleTimeString()}] ${t}<br>`+document.getElementById('log').innerHTML}
function laneToX(l){return [20,50,80][l]} // Wider lanes
function spawn(){for(let i=0;i<8;i++)cars.push({lane:Math.floor(Math.random()*3),z:100+i*90,speed:60+Math.random()*20,type:['car','bike','truck','bus'][Math.floor(Math.random()*4)],el:null,label:null})} // Traffic also has speed
spawn();

// LIVE CLOCK
setInterval(()=>{document.getElementById('clock').innerText = new Date().toLocaleTimeString()},1000);

function aiThink(){
  let danger = cars.filter(o=>o.lane===egoLane && o.z<120 && o.z>20);
  let closestZ = danger.length? Math.min(...danger.map(o=>o.z)) : 999;
  let leftClear =!cars.some(o=>o.lane===0 && Math.abs(o.z-closestZ)<120);
  let rightClear =!cars.some(o=>o.lane===2 && Math.abs(o.z-closestZ)<120);

  if(danger.length && closestZ < 70){thinking="AEB EMERGENCY"; speed=Math.max(15,speed-10); steer=0; return "BRAKE"}
  else if(danger.length && closestZ < 160){
    if(leftClear){thinking="OVERTAKE LEFT"; egoLane=0; steer=-25; return "LANE_CHANGE"}
    if(rightClear){thinking="OVERTAKE RIGHT"; egoLane=2; steer=25; return "LANE_CHANGE"}
    thinking="FOLLOW"; speed=Math.max(40,speed-4); steer=0; return "SLOW"
  }
  else {thinking="FSD CRUISE"; speed=Math.min(90,speed+0.5); steer*=0.9; return "ACCEL"}
}

function updateCameras(){
  document.getElementById('objects').innerText = cars.length + " OBJECTS";
  ['F','L','R','B'].forEach(dir=>{
    const cam = document.getElementById('cam'+dir);
    let html = '';
    cars.filter(o=>Math.abs(o.z-200)<150).slice(0,2).forEach((o,i)=> html += `<div class="box" style="left:${15+i*30}%;top:30%;width:25%;height:20%"></div>`);
    cam.innerHTML = html;
  })
}

function loop(){
  aiThink();
  distance += speed/3600; // km

  cars.forEach(o=>{
    o.z -= (speed - o.speed)*0.4; // Relative speed - both moving
    if(o.z<0){o.z=700+Math.random()*200;o.lane=Math.floor(Math.random()*3);o.speed=60+Math.random()*20}
    if(!o.el){o.el=document.createElement('div');o.el.className='car';traffic.appendChild(o.el); o.label=document.createElement('div');o.label.className='car-label';traffic.appendChild(o.label)}
    let p=300/(o.z+150); let y= 5 + (95-5)*(1-p); let x=laneToX(o.lane);
    o.el.style.top=y+'%'; o.el.style.left=x+'%'; o.el.style.width=(p*50+20)+'px'; o.el.style.height=(p*25+12)+'px';
    o.el.style.background=o.type==='truck'?'#888':o.type==='bus'?'#00aaff':o.type==='bike'?'#ff4444':'#ff3333';
    o.label.style.top=(y-4)+'%'; o.label.style.left=x+'%'; o.label.innerText=o.type.toUpperCase()+' '+Math.floor(o.z/6)+'m';
  });

  egoX=laneToX(egoLane);
  ego.style.left=egoX+'%';
  wheel.style.transform = `rotate(${steer}deg)`; // STEERING WHEEL TURNS

  updateCameras();
  document.getElementById('speed').innerText=Math.floor(speed)+' km/h';
  document.getElementById('brain').innerText=thinking;
  document.getElementById('distance').innerText=distance.toFixed(1)+' km';
  document.getElementById('prediction').innerText = thinking.includes('AEB')? '-2s DANGER' : '+10s SAFE';

  requestAnimationFrame(loop)
}
loop();log('TASLA JSM v14 PRO LIVE BOOTED');log('NO 3AM. REAL TIME. REAL TRAFFIC. ELON READY');
</script></body></html>
